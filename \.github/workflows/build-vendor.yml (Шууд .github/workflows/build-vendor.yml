# .github/workflows/build-vendor.yml
#
# Builds a flashable Vendor ZIP for the Samsung Galaxy J7 Pro (J737S).
# - Runs on every push to main/master
# - Can be triggered manually via workflow_dispatch
# - Uploads the ZIP as a build artifact on every run
# - Creates a GitHub Release with the ZIP attached when a `v*` tag is pushed

name: Build Vendor ZIP (J737S)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'          # e.g. v1.0, v1.0.1 -> triggers the release job
  workflow_dispatch:    # allows manual runs from the Actions tab

# Needed so the workflow can create a release and upload assets to it
permissions:
  contents: write

jobs:
  build:
    name: Build Vendor ZIP
    runs-on: ubuntu-latest

    outputs:
      zip_name: ${{ steps.package.outputs.zip_name }}

    steps:
      # ---------------------------------------------------------------
      # 1. Check out the repository (full history not needed, but we
      #    fetch enough to get a reliable short commit hash)
      # ---------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------------
      # 2. Install build dependencies
      # ---------------------------------------------------------------
      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip p7zip-full rsync git python3

      # ---------------------------------------------------------------
      # 3. Sanity-check that required paths exist before we try to
      #    package them. Fail fast with a clear error otherwise.
      # ---------------------------------------------------------------
      - name: Verify required source paths
        run: |
          set -e
          if [ ! -d "vendor" ]; then
            echo "::error::Missing required '/vendor' directory in repository root."
            exit 1
          fi
          if [ ! -f "META-INF/com/google/android/update-binary" ]; then
            echo "::error::Missing META-INF/com/google/android/update-binary"
            exit 1
          fi
          if [ ! -f "META-INF/com/google/android/updater-script" ]; then
            echo "::error::Missing META-INF/com/google/android/updater-script"
            exit 1
          fi

      # ---------------------------------------------------------------
      # 4. Assemble the flashable package in a clean staging directory
      #    so the final ZIP only contains what's needed (vendor + the
      #    updater METshellA-INF scripts), not the whole git repo.
      # ---------------------------------------------------------------
      - name: Stage package contents
        id: package
        run: |
          set -e

          # Short commit hash used in the artifact/zip filename
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          ZIP_NAME="Vendor_J737S_${SHORT_SHA}.zip"

          echo "Building package: ${ZIP_NAME}"

          STAGE_DIR="staging"
          rm -rf "${STAGE_DIR}"
          mkdir -p "${STAGE_DIR}/vendor"
          mkdir -p "${STAGE_DIR}/META-INF/com/google/android"

          # Copy vendor partition contents
          rsync -a --exclude='.git*' vendor/ "${STAGE_DIR}/vendor/"

          # Copy the dynamic installer scripts required by recovery
          cp META-INF/com/google/android/update-binary \
             "${STAGE_DIR}/META-INF/com/google/android/update-binary"
          cp META-INF/com/google/android/updater-script \
             "${STAGE_DIR}/META-INF/com/google/android/updater-script"

          # Ensure the installer script is executable inside the zip
          chmod 755 "${STAGE_DIR}/META-INF/com/google/android/update-binary"

          # Persist values for later steps/jobs
          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------
      # 5. Compress into a flashable ZIP.
      #    NOTE: update-binary/updater-script must be stored (not just
      #    present) with correct paths relative to the zip root for
      #    recovery (TWRP/stock) to detect and run them correctly.
      # ---------------------------------------------------------------
      - name: Create flashable ZIP
        run: |
          set -e
          cd staging
          zip -r9 "../${{ steps.package.outputs.zip_name }}" . -x ".*"
          cd ..
          echo "Generated file:"
          ls -lh "${{ steps.package.outputs.zip_name }}"

      # ---------------------------------------------------------------
      # 6. Upload the ZIP as a workflow artifact (available on every run,
      #    tagged or not, for QA/testing before a release is cut).
      # ---------------------------------------------------------------
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip_name }}
          path: ${{ steps.package.outputs.zip_name }}
          retention-days: 30

      # ---------------------------------------------------------------
      # 7. Keep the built ZIP around for the release job below
      #    (separate jobs don't share a filesystem).
      # ---------------------------------------------------------------
      - name: Stash ZIP for release job
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: ${{ steps.package.outputs.zip_name }}
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Only runs when the push was a tag matching v* (e.g. v1.0)
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      # ---------------------------------------------------------------
      # 1. Retrieve the ZIP built in the previous job
      # ---------------------------------------------------------------
      - name: Download built ZIP
        uses: actions/download-artifact@v4
        with:
          name: release-zip
          path: ./release-assets

      # ---------------------------------------------------------------
      # 2. Create the GitHub Release for this tag and attach the ZIP.
      #    softprops/action-gh-release auto-creates the release if it
      #    doesn't already exist for this tag.
      # ---------------------------------------------------------------
      - name: Create Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          name: J737S Vendor ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: ./release-assets/${{ needs.build.outputs.zip_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
